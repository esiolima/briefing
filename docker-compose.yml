services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: martins_briefing
      POSTGRES_USER: martins
      POSTGRES_PASSWORD: martins
    ports:
      - "5432:5432"
    volumes:
      - martins_briefing_db:/var/lib/postgresql/data

volumes:
  martins_briefing_db:
